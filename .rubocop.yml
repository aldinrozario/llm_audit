AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

# A check is mostly the frozen text it reports: RequestTimeout is ~60% message and remediation literals,
# which are data the class holds rather than code paths a reader has to follow. Counting each literal once
# measures the part that can actually get out of hand. The extraction seam that would otherwise relieve the
# pressure is closed: spec/llm_audit/checks/stdout_invariant_spec.rb globs lib/llm_audit/checks/**/*.rb and
# ties the registry size to the file count there, so no check may split its text into a sibling file.
Metrics/ClassLength:
  CountAsOne:
    - hash

Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "spec/**/*_spec.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false
